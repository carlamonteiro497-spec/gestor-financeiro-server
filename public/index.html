<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Gestor Financeiro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            text-align: center;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        /* Cards Section */
        .cards-section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .card:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transform: translateY(-5px);
        }

        .card.positive {
            border-color: #28a745;
        }

        .card.negative {
            border-color: #dc3545;
        }

        .card.warning {
            border-color: #ffc107;
        }

        .card-label {
            font-size: 0.8em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }

        .card-value.positive {
            color: #28a745;
        }

        .card-value.negative {
            color: #dc3545;
        }

        /* Calendar Section */
        .calendar-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .calendar-header button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .calendar-header button:hover {
            background: #764ba2;
        }

        .calendar-header h3 {
            color: #333;
            font-size: 1.5em;
            flex: 1;
            text-align: center;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .weekday {
            text-align: center;
            font-weight: 600;
            color: #666;
            padding: 10px 0;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
        }

        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            font-weight: 500;
            position: relative;
        }

        .day:hover {
            border-color: #667eea;
            background: #f9f9f9;
        }

        .day.today {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .day.has-event {
            border-color: #dc3545;
            background: #ffe5e5;
        }

        .day.has-event.today {
            background: #dc3545;
        }

        .day-number {
            font-size: 1.1em;
        }

        .day-dot {
            width: 6px;
            height: 6px;
            background: #dc3545;
            border-radius: 50%;
            margin-top: 2px;
        }

        .day.has-event.today .day-dot {
            background: white;
        }

        .day.empty {
            background: #f9f9f9;
            cursor: default;
            border-color: #f0f0f0;
        }

        .day.empty:hover {
            background: #f9f9f9;
            border-color: #f0f0f0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .modal-title {
            font-size: 1.6em;
            color: #333;
            margin-bottom: 20px;
        }

        .modal-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 25px;
        }

        .modal-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .modal-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .modal-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .calendar-weekdays,
            .calendar-days {
                gap: 5px;
            }

            .day {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Gestor Financeiro</h1>
            <p>Controle suas finanças com facilidade</p>
        </header>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando dados...</p>
        </div>

        <div id="content" style="display:none;">
            <div class="main-layout">
                <!-- Cards -->
                <div class="cards-section">
                    <h2>📊 Resumo</h2>
                    <div class="cards-grid" id="cards-container"></div>
                </div>

                <!-- Calendário -->
                <div class="calendar-section">
                    <div class="calendar-header">
                        <button onclick="mesPrevio()">← Anterior</button>
                        <h3 id="calendarMonth">Outubro 2026</h3>
                        <button onclick="mesProximo()">Próximo →</button>
                    </div>

                    <div class="calendar-weekdays">
                        <div class="weekday">Dom</div>
                        <div class="weekday">Seg</div>
                        <div class="weekday">Ter</div>
                        <div class="weekday">Qua</div>
                        <div class="weekday">Qui</div>
                        <div class="weekday">Sex</div>
                        <div class="weekday">Sab</div>
                    </div>

                    <div class="calendar-days" id="calendar-days"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal" onclick="fecharModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="fecharModal()">×</button>
            <div class="modal-title" id="modalTitle"></div>
            <div class="modal-value" id="modalValue"></div>
            <table class="modal-table">
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th style="text-align: right;">Valor</th>
                    </tr>
                </thead>
                <tbody id="modalTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let dados = {};
        let mesAtual = new Date(2026, 9); // Outubro 2026

        const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                       'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

        const cardsConfig = [
            { id: 'renda', label: '💵 RENDA LÍQUIDA', value: 6578.13, type: 'positive' },
            { id: 'vale', label: '🍽️ VALE ALIMENTAÇÃO', value: 565.92, type: 'positive' },
            { id: 'reembolsos', label: '↩️ REEMBOLSOS', value: 0, type: 'positive' },
            { id: 'contas-fixas', label: '🏠 CONTAS FIXAS', value: 4561.13, type: 'negative' },
            { id: 'cartao-santander', label: '💳 CARTÃO SANTANDER', value: 7368.73, type: 'negative' },
            { id: 'demais-cartoes', label: '💳 DEMAIS CARTÕES', value: 1215.59, type: 'warning' },
            { id: 'disponivel', label: '📈 DISPONÍVEL', value: -6567.32, type: 'negative' }
        ];

        function formatarMoeda(valor) {
            return 'R$ ' + parseFloat(valor || 0).toFixed(2).toString().replace('.', ',');
        }

        async function carregarDados() {
            try {
                const response = await fetch('dados.json');
                const data = await response.json();
                dados = data;

                preencherCards();
                gerarCalendario();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                console.error('Erro:', error);
            }
        }

        function preencherCards() {
            let html = '';

            cardsConfig.forEach(cardConfig => {
                html += `
                    <div class="card ${cardConfig.type}" onclick="abrirCard('${cardConfig.id}')">
                        <div class="card-label">${cardConfig.label}</div>
                        <div class="card-value ${cardConfig.type}">${formatarMoeda(cardConfig.value)}</div>
                    </div>
                `;
            });

            document.getElementById('cards-container').innerHTML = html;
        }

        function gerarCalendario() {
            const ano = mesAtual.getFullYear();
            const mes = mesAtual.getMonth();

            document.getElementById('calendarMonth').textContent = meses[mes] + ' ' + ano;

            const primeiroDia = new Date(ano, mes, 1).getDay();
            const ultimoDia = new Date(ano, mes + 1, 0).getDate();

            let html = '';

            // Dias vazios antes do primeiro dia do mês
            for (let i = 0; i < primeiroDia; i++) {
                html += '<div class="day empty"></div>';
            }

            // Dias do mês
            const transacoes = dados.transacoes || [];
            for (let dia = 1; dia <= ultimoDia; dia++) {
                const dataStr = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
                const temEvento = transacoes.some(t => t[0] === dataStr);

                const hoje = new Date();
                const ehHoje = dia === hoje.getDate() && mes === hoje.getMonth() && ano === hoje.getFullYear();

                const classes = `day ${temEvento ? 'has-event' : ''} ${ehHoje ? 'today' : ''}`;

                html += `
                    <div class="${classes}" onclick="abrirDia('${dataStr}')">
                        <div class="day-number">${dia}</div>
                        ${temEvento ? '<div class="day-dot"></div>' : ''}
                    </div>
                `;
            }

            document.getElementById('calendar-days').innerHTML = html;
        }

        function abrirCard(cardId) {
            const config = cardsConfig.find(c => c.id === cardId);
            if (!config) return;

            document.getElementById('modalTitle').textContent = config.label;
            document.getElementById('modalValue').textContent = formatarMoeda(config.value);

            const transacoes = dados.transacoes || [];
            let linhas = transacoes.slice(1);

            let html = '';
            linhas.forEach(linha => {
                html += `
                    <tr>
                        <td>${linha[1] || '-'}</td>
                        <td style="text-align: right; color: #dc3545; font-weight: 600;">-${formatarMoeda(linha[4])}</td>
                    </tr>
                `;
            });

            document.getElementById('modalTableBody').innerHTML = html || '<tr><td colspan="2" style="text-align: center; padding: 20px;">Sem transações</td></tr>';
            document.getElementById('modal').classList.add('show');
        }

        function abrirDia(data) {
            const transacoes = dados.transacoes || [];
            const doData = transacoes.filter(t => t[0] === data);

            if (doData.length === 0) return;

            const dataParts = data.split('-');
            const dataFormatada = `${dataParts[2]}/${dataParts[1]}/${dataParts[0]}`;

            document.getElementById('modalTitle').textContent = `📅 Transações de ${dataFormatada}`;

            let total = 0;
            let html = '';
            doData.forEach(linha => {
                const valor = parseFloat(linha[4]) || 0;
                total += valor;
                html += `
                    <tr>
                        <td>${linha[1] || '-'}</td>
                        <td style="text-align: right; color: #dc3545; font-weight: 600;">-${formatarMoeda(valor)}</td>
                    </tr>
                `;
            });

            document.getElementById('modalValue').textContent = formatarMoeda(total);
            document.getElementById('modalTableBody').innerHTML = html;
            document.getElementById('modal').classList.add('show');
        }

        function fecharModal(event) {
            if (event && event.target !== document.getElementById('modal')) return;
            document.getElementById('modal').classList.remove('show');
        }

        function mesPrevio() {
            mesAtual.setMonth(mesAtual.getMonth() - 1);
            gerarCalendario();
        }

        function mesProximo() {
            mesAtual.setMonth(mesAtual.getMonth() + 1);
            gerarCalendario();
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
